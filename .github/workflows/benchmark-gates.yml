name: benchmark-gates

on:
  pull_request:
  push:

jobs:
  milestone-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Epicurus
        run: python -m pip install -e '.[dev]'
      - name: Clone official IMPROVE artifacts
        run: git clone https://github.com/SRHgroup/IMPROVE_paper.git /tmp/IMPROVE_paper
      - name: Enforce scorecard, leakage canary, and PRIME gates
        run: pytest -q tests/test_milestone1_benchmark.py
      - name: Run repository regression suite
        run: pytest -q

  milestone-5a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Epicurus
        run: python -m pip install -e '.[dev]'
      - name: Ingest Braun RCC Event-B slice (fetches open-access supplements)
        run: python scripts/event_b_corpus.py import-braun-rcc
      - name: Enforce Braun Event-B reconciliation and label-integrity gates
        run: pytest -q tests/test_braun_rcc_event_b.py

  milestone-5b1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Epicurus
        run: python -m pip install -e '.[dev]'
      # The Hu 2021 supplement is a ~2.2 GB PMC author manuscript behind a proof-of-work
      # download gate; it cannot be fetched in CI. These synthetic-logic gates enforce the
      # adapter's behaviour (three-state labels, class-I/II handling, epitope-spreading
      # separation, non-flattened reliability, multi-study verdict); the real-source
      # reconciliation and combined-audit tests skip unless the manual supplement is present.
      - name: Enforce Hu melanoma Event-B label-integrity and separation gates
        run: pytest -q tests/test_hu_neovax_event_b.py
