datasets:
  neoranking:
    name: NeoRanking / Immunity 2023
    role: train_validation
    locked_test: false
    url: https://github.com/bassanilab/NeoRanking
    direct_download: null
    files:
      neopep_data_org:
        url: https://figshare.com/s/a000b0990465ab3e9d33
        filename: Neopep_data_org.txt.zip
        size: 160 MB
        license: GPL
        notes: Figshare may require browser/manual download because of WAF challenge.
      mutation_data_org:
        url: https://figshare.com/s/3c27fa3b705a74bdfa10
        filename: Mutation_data_org.txt.zip
        size: 6.64 MB
        license: CC BY 4.0
        notes: Figshare may require browser/manual download because of WAF challenge.
      gartner_nmers_ranking:
        url: https://raw.githubusercontent.com/bassanilab/NeoRanking/master/Data/Gartner_nmers_ranking.txt
        filename: Gartner_nmers_ranking.txt
        size: 47 rows
        license: repository license unclear
        notes: Small ranking file committed in the NeoRanking repository.
    notes: >
      Main harmonized training backbone. Use patient-level and study-level folds;
      do not row-split for headline claims.

  tesla:
    name: TESLA / Wells et al. 2020
    role: locked_test
    locked_test: true
    url: https://pubmed.ncbi.nlm.nih.gov/33038342/
    direct_download: null
    notes: >
      Locked benchmark. Do not use for feature search, threshold tuning, model
      selection, or LLM-guided hypothesis selection.

  gartner_nci:
    name: Gartner / NCI neoantigen ranking datasets
    role: locked_or_secondary_test
    locked_test: true
    url: https://nih.figshare.com/collections/Datasets_for_Development_of_a_model_for_ranking_candidate_HLA_class_I_neoantigens_based_upon_datasets_of_known_neoepitopes_/4792338
    direct_download: null
    files:
      mmps_training:
        url: https://nih.figshare.com/articles/dataset/Training_Set_of_Mutated_Minimal_Peptides_Screened_by_NCI_Surgery_Branch_for_Reactivity_Against_TIL/11400969
        filename: MmpsTrainingSet.txt
        size: 7.19 GB
        license: CC BY 4.0
        notes: Very large; do not download by default.
      nmers_balanced:
        url: https://ndownloader.figshare.com/files/26042741
        filename: NmersBalancedForExpression.txt
        size: 2.02 MB
        license: CC BY 4.0
        notes: Direct API-discovered download URL; avoids browser challenge page.
      nmers_testing:
        url: https://ndownloader.figshare.com/files/26040932
        filename: NmersTestingSet.txt
        size: 4.11 MB
        license: CC BY 4.0
        notes: Direct API-discovered download URL; contains 46 positives and 3722 tested negatives.
      nmers_training:
        url: https://ndownloader.figshare.com/files/26038703
        filename: NmersTrainingSet.txt
        size: 12.55 MB
        license: CC BY 4.0
        notes: Direct API-discovered download URL; mostly unscreened rows plus CD8 positives.
    notes: >
      Contains official train/test style resources for candidate neoantigen
      ranking. Preserve official splits when available.

  cedar:
    name: CEDAR cancer epitope database
    role: auxiliary_train_validation
    locked_test: false
    url: https://cedar.iedb.org/
    direct_download: https://cedar.iedb.org/database_export_v3.php
    notes: >
      Use for extra assay labels and epitope-neighborhood retrieval. Requires
      strict assay normalization and deduplication.

  nepdb:
    name: NEPdb
    role: auxiliary_train_validation
    locked_test: false
    url: https://nep.whu.edu.cn/
    direct_download: null
    notes: >
      Curated neoepitope database useful for tested negatives and external
      validation after overlap checks.

  dbpepneo2:
    name: dbPepNeo2.0
    role: auxiliary_retrieval_external_check
    locked_test: false
    url: https://www.frontiersin.org/journals/immunology/articles/10.3389/fimmu.2022.855976/full
    direct_download: null
    notes: >
      Useful for known positive neoantigen and TCR links. High overlap risk; use
      as retrieval features unless a strict holdout is built.

  bigmhc:
    name: BigMHC data
    role: baseline_and_optional_train
    locked_test: false
    url: https://data.mendeley.com/datasets/dvmz6pkzvb/4
    direct_download: null
    files:
      datasets_zip:
        url: https://data.mendeley.com/public-files/datasets/dvmz6pkzvb/files/1da0314f-692d-4c39-b81f-fa2a7dba86bf/file_downloaded
        filename: datasets.zip
        size: 144.27 MB
        sha256: 0d152a452756cf2e0014ffced6afc25118e7c11cf1f626b26e49f50f79edffaa
        license: CC BY 4.0
        notes: Contains im_train.csv, im_val.csv, im_test.csv, iedb.csv, and EL tables.
      manafest:
        url: https://data.mendeley.com/public-files/datasets/dvmz6pkzvb/files/6de56487-7b7e-459e-8aee-c80475face9d/file_downloaded
        filename: manafest.csv
        size: 34.59 KB
        sha256: accf19b8bb797ec842c3ee1b1ce1966feb35035df746f7a56b2994403ba1ad99
        license: CC BY 4.0
        notes: Neoepitope immunogenicity rows with wildtype peptide and gene.
    notes: >
      Use available BigMHC scores as baselines/features. Keep im_test locked if
      used for external comparison.

  cd8_multimer_2025:
    name: Cross-tumor patient pHLA multimer screen / Immuno-Oncology and Technology 2025
    role: external_test_and_grouped_training
    locked_test: false
    url: https://doi.org/10.1016/j.iotech.2025.101062
    direct_download: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12318345/supplementaryFiles
    files:
      supplementary:
        url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12318345/supplementaryFiles
        filename: PMC12318345_supplementary.zip
        size: 3.1 MB
        sha256: 662c122cd1a37fea466ac27c63f95a12aa15e17abd6f6fd428eddecf3443975a
        license: CC BY-NC-ND 4.0
        notes: >
          mmc2.xlsx contains 8,103 tested patient peptide-HLA candidates across
          26 patients, with 34 multimer-positive responses. Evaluate with
          patient-grouped splits; never use random row splits.
    notes: >
      High-value direct recognition dataset. The source candidate-generation
      filters differ between the TIL and PBMC cohorts, so retain specimen source
      and report both pooled and stratified results.

  fukuoka_vaccine_2026:
    name: Fukuoka personalized neoantigen vaccine cohort 2026
    role: future_external_test_and_grouped_training
    locked_test: false
    url: https://doi.org/10.3389/fimmu.2026.1829509
    direct_download: null
    notes: >
      Reports 2,317 vaccinated short peptides from 352 patients with 313
      post-vaccination ELISpot positives. The publisher XML references
      Table1.xlsx, but the Frontiers file endpoints currently return 404.

  improve:
    name: IMPROVE broad-scale T-cell recognition dataset
    role: primary_grouped_training
    locked_test: false
    url: https://github.com/SRHgroup/IMPROVE_paper
    direct_download: https://codeload.github.com/SRHgroup/IMPROVE_paper/zip/refs/heads/main
    notes: >
      The official CV matrix contains 17,520 experimentally tested candidates,
      467 positives, 70 patients, and five patient-disjoint partitions. Preserve
      the published Partition column and do not use random row splits.
