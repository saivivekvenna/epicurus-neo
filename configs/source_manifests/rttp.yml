manifest_version: event-b-cohort-source-1.0.0
source_id: rttp_sr24
status: INGESTED_DEPLOYMENT_CASE
role: REAL_CLINICAL_INPUT_DEMO   # North-Star input; NOT a recognition benchmark (no experimental labels)

cite: >-
  Research to the People (RTTP) patient-partnered multiomics program. One de-identified tumor/normal
  specimen, Personalis ImmunoID NeXT-style report. Shared under a signed Data Use Agreement.
provenance:
  disclosing_party: Research to the People (data@researchtothepeople.org)
  recipient: SaiVivek Venna (DUA on file: ~/Downloads/_Data Use Agreement (DUA).pdf)
  drive_folder: https://drive.google.com/drive/folders/1F6-Fu57HMoUwECv4EXGXP9hMsnSpt8km
  gitignored: true   # controlled patient data — never committed / never redistributed

why_this_case: >-
  First genuine end-to-end deployment target: a COMPLETE North-Star input — WES somatic mutations + RNA-seq
  expression (TPM) + full class-I/II HLA typing + HLA LOH + the vendor's neoantigen candidate universe. Lets us
  run the real Epicurus stack (genuine PRIME + MHCflurry EL + expression -> frozen v0.1 residual) on a real
  patient and emit a ranked neoantigen list with real deployment features (HLA LOH, full-mutanome denominator).

not_a_benchmark: >-
  The report carries NO experimental T-cell recognition label; its "Immunogenicity Score" is a PREDICTED value.
  With no measured answer key, ranking against it would be circular. So this case is scored for a RANKED LIST +
  method concordance ONLY — no hits@20 / AUROC / ACCEPT-gate, no superiority claim. The recognition wall
  (decision-benchmark-nci, checkmate153) still requires measured labels.

# NOTE: patient-specific values (variants, peptide sequences, HLA genotype, expression, the ranked
# neoantigen list) are DUA-controlled and are NOT recorded here — they live only in the gitignored
# data/raw/rttp/ inputs and artifacts/milestone_7_decision/rttp_sr24/ outputs. Aggregate stats only below.
structure:
  patient: one tumor/normal specimen (de-identified accession).
  folders_downloaded_local: [Neoantigen, HLA]   # RNA_Pipeline NOT needed — TPM is embedded in the neoantigen report
  candidate_table: class-I neoantigen SNV/Indel report — 64,278 peptide x HLA rows; 10,647 peptides;
    282 mutations; 6 class-I HLA alleles. Columns include Peptide, HLA, SHERPA/NetMHCpan ranks, HLA LOH,
    DNA/RNA AF, Gene TPM/FPKM, Expressed, Immunogenicity Score, Self/Known-Antigen Similarity.
  hla: full class-I/II typing available locally; ONE class-I allele lost to LOH (HIGH confidence) -> its
    presentations are dropped in the deployable ranking.

featurization:
  prime: genuine GfellerLab PRIME 2.1 %rank (event_b.prime_adapter.score_prime); cached data/raw/rttp/_cache_prime.tsv
  el: MHCflurry 2.2.1 presentation percentile; cached data/raw/rttp/_cache_mhcflurry.tsv
  expr: gene-level TPM from the report.
  model: frozen Epicurus v0.1 (configs/frozen/epicurus_v0_1.json) via score_with_frozen; within-patient percentiles.

result:   # aggregate method-agreement metrics only (no answer key exists; no performance claim)
  concordance_spearman_per_candidate: {epicurus_vs_prime: 0.966, epicurus_vs_sherpa: 0.003, epicurus_vs_rttp_immuno: 0.101}
  concordance_spearman_per_mutation: {epicurus_vs_prime: 0.264, epicurus_vs_sherpa: 0.213, epicurus_vs_rttp_immuno: 0.103}
  loh: LOH-lost allele dropped in the deployable ranking; only 1/20 top mutations relied on it (re-routed to retained alleles).
  headline: Epicurus raw-scores like PRIME (0.966) but the per-mutation shortlist diverges (2/20 shared w/ PRIME,
    7/20 w/ SHERPA); no method agrees with the vendor's predicted immunogenicity; labels needed to adjudicate.
  runner: scripts/rttp_rank.py
  artifact_dir: artifacts/milestone_7_decision/rttp_sr24/   # gitignored (DUA-controlled)

ask_rttp_for:
  - measured T-cell recognition (ELISpot / tetramer / TIL reactivity / vaccine response) for ANY patient = the missing answer key
  - total patient count with matched tumor/normal WES + RNA + HLA, and which also have immune monitoring
  - a cohort-level manifest across patients
