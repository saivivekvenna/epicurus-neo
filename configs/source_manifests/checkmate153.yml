manifest_version: event-b-cohort-source-1.0.0
source_id: checkmate153
status: INGESTED_EXTERNAL_TEST
role: INDEPENDENT_PRIME_UNTOUCHED_RECOGNITION_COHORT

cite: >-
  Alban TJ, Riaz N, et al. Neoantigen immunogenicity landscapes and evolution of tumor ecosystems
  during immunotherapy with nivolumab (CheckMate 153). Nature Medicine 30:3209-3222 (2024).
doi: 10.1038/s41591-024-03240-y
pmcid: PMC12066197

why_this_cohort: >-
  class-I, HLA-resolved combinatorial-tetramer neoantigen screen; a genuine within-patient decision
  problem (14 pts, 1,197 predicted-binder 9-mers, 162 tetramer-POSITIVE vs 1,035 tetramer-TESTED_NEGATIVE);
  PRIME-untouched (tetramer labels Oct-2024, post-date PRIME 2.0's 2023 Lausanne training set). See
  artifacts/milestone_7_decision/external_validation/DATA_ACQUISITION_SHORTLIST.md (rank A1).

download:
  host: Nature static-content (open; no auth, no proof-of-work — unlike the PMC /bin/ gate).
  files:
    - url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41591-024-03240-y/MediaObjects/41591_2024_3240_MOESM4_ESM.xlsx
      local: data/raw/checkmate153/CM153_NatMed_MOESM4.xlsx   # neoantigen tables (maf, model_training/testing, Study_validation)
      sha256: 2d3c5293220bc2e4398c919a32126059a84c8d9d1a1cdf7383ef7ecb3add9c36
    - url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41591-024-03240-y/MediaObjects/41591_2024_3240_MOESM3_ESM.xlsx
      local: data/raw/checkmate153/CM153_NatMed_MOESM3.xlsx   # RNA-seq (CountTableBMS153 -> gene expression)
      sha256: a055b38e7003a21688db89e4bd375eb6a611c6b95a22d39de320c2806238c5b6
  gitignored: true   # supplements not redistributed; re-download from the URLs above.

structure:
  candidate_table: MOESM4 sheets model_training (837) + model_testing (360); key `pt_pep`=Pt####_PEPTIDE,
    label `tet_pos_or_neg`, restricting allele from the V1_<ALLELE> one-hot (row-sum==1). Merged into one
    within-patient universe of 1,197 candidates across 14 patients.
  metadata_join: MOESM4 `maf` on (Patient, MT.Peptide.x) -> Hugo_Symbol, WT.Peptide, vaf_maf.pre (1197/1197).
  expression: MOESM3 CountTableBMS153 (gene x sample) -> patient `_pre` baseline count (228/1197 mapped).
  discarded: the paper's own `scores` column (their trained model = circular; never used as a feature).
  secondary: MOESM4 `Study_validation` (590 rows, 28 pos, allele in key, NO patient grouping) — pooled
    external check only, not used in the within-patient gate.

leakage_adjudication:
  prime_training_near_or_exact: 14 of 1197 (1.2%, report-only; a TEST cohort is never filtered).
  frozen_v01_training: trained on CD8 multimer only; CheckMate never used to fit it.

featurization:
  prime: genuine GfellerLab PRIME 2.1 %rank via prime_adapter.score_prime (1197/1197 scored). REAL_PRIME.
  el: MHCflurry 2.2.1 presentation_percentile (NetMHCpan-EL not installed; scale-free within-patient).
  expr: MOESM3 gene counts (baseline sample).

result:
  gate: frozen Epicurus v0.1 vs genuine PRIME, source-balanced within-patient mean hits@20, patient-paired bootstrap.
  all_negatives: Δhits@20 +0.071 CI[-0.357,+0.571] -> TIE (CONSISTENT_WITH_NO_EFFECT).
  binders_only: Δhits@20 +0.071 CI[-0.214,+0.429] -> TIE. AUROC ~0.53-0.60 for ALL methods incl genuine PRIME.
  headline: presentation (MixMHCpred) is the ceiling; recognition among presented peptides is near-chance.
  runner: scripts/checkmate153_dev.py
  artifact: artifacts/milestone_7_decision/checkmate153/CM153_EXTERNAL.json (+ CM153_REPORT.md)
