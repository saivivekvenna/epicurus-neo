manifest_version: event-b-cohort-source-1.0.0
source_id: miller_ipv
status: PLANNED_VERIFY_BEFORE_DOWNLOAD          # do NOT bulk-download until the preflight gates below pass
role: CANDIDATE_INDEPENDENT_PRIME_UNTOUCHED_END_TO_END_COHORT
intended_use: LOCKED_TEST                        # independent, low-leakage; fixed before any label touches the model

cite: >-
  Miller et al. A functional identification platform reveals frequent, spontaneous neoantigen-specific
  T cell responses in patients with cancer. Sci Transl Med (2024).
  NOTE: "IPV" = "identify-prioritize-validate" PLATFORM, not "individualized peptide vaccine".
doi: 10.1126/scitranslmed.abj9905
submitter: La Jolla Institute for Immunology

why_this_cohort: >-
  The only fully-OPEN end-to-end (Level-3) build prospect: raw WES + RNA-seq are public (no DAR), and the
  per-peptide IFN-g ELISpot outcomes (POSITIVE and TESTED-NEGATIVE) are in the supplement. 13 patients, 8
  solid-tumor types. Independent (La Jolla), 2024 -> LOW leakage vs PRIME 2.0's 2023 Lausanne training set.
  See artifacts/milestone_7_decision/external_validation/ACQUISITION_EXECUTION_PLAN.md (rank 1).

north_star_fit:
  primary_metric: patient-level paired delta in recognized hits@20 (Epicurus vs pVAC-style + genuine PRIME)
  denominator_caveat: >-
    349 tested variants are IPV-PREFILTERED (top-ranked of 6,237 detected). A clean north-star run must
    RE-ENUMERATE the full class-I mutanome from the deposited WES so both arms share one candidate universe;
    the 349 tested + their labels define the recognized/tested-negative subset, not the whole denominator.

# ---- PREFLIGHT GATES (all must pass before any large download; this is the "verify first" contract) ----
preflight_gates:
  - id: label_table_open
    check: >-
      Supplementary data files S1/S2 (individual peptides tested per patient + ELISpot POSITIVE/NEGATIVE
      outcome) are downloadable. science.org returned HTTP 403 to automated fetch -> REQUIRES A HUMAN BROWSER
      CHECK at https://www.science.org/doi/suppl/10.1126/scitranslmed.abj9905
    status: UNVERIFIED_BLOCKER
  - id: explicit_negative_counts
    check: exact POSITIVE vs TESTED_NEGATIVE peptide counts (in S1/S2; only >40% PPV on the prioritized set is public)
    status: UNVERIFIED
  - id: hla_recoverable
    check: 4-digit class-I HLA per patient — no published table (paper is "HLA-agnostic"); recover from WES via OptiType/arcasHLA
    status: RECOVER_FROM_WES
  - id: peptide_hla_pairing
    check: whether S1/S2 record the restricting allele per tested peptide (needed for PRIME/EL scoring)
    status: UNVERIFIED
  - id: sra_split_and_size
    check: exact WES-vs-RNA run split + total size (auto-fetch reported ~26 WES + ~13 RNA, ~0.23 TB) on the live SRA page
    status: SPOT_CHECK

download:
  raw_sequencing:
    host: NCBI SRA / BioProject (open; S3 + GS cloud mirrors)
    bioproject: PRJNA980652
    landing: https://www.ncbi.nlm.nih.gov/bioproject/PRJNA980652
    sra_query: https://www.ncbi.nlm.nih.gov/sra/?term=PRJNA980652
    approx: ~39 runs (~26 WES tumor+normal, ~13 RNA-seq tumor), Illumina NovaSeq 6000 PE FASTQ, ~0.23 TB
    access: OPEN (no dbGaP/DAR); no explicit license text found on SRA (public NCBI record)
    gitignored: true
    download_policy: DEFERRED_UNTIL_PREFLIGHT_PASSES   # do not pull 0.23 TB before label_table_open is confirmed
  labels_supplement:
    host: science.org (Atypon) — data files S1 (peptides+outcomes), S2 (peptides+outcomes), S3 (figure source)
    url: https://www.science.org/doi/suppl/10.1126/scitranslmed.abj9905
    access: UNVERIFIED (403 to bot; STM supplements are usually free — confirm in browser)
    gitignored: true

reconstruction_plan:
  # once WES/RNA land (destination data/raw/miller_ipv/regenerated/)
  1_hla: OptiType/arcasHLA on WES -> hla_genotype.tsv (patient\talleles), 4-digit class I
  2_somatic: tumor-vs-normal calling -> per-mutation VAF/read-depth
  3_rna: quantify RNA-seq -> per-gene/transcript TPM + mutant-allele RNA evidence
  4_universe: mutations -> all class-I 8-11mer neoepitopes restricted to patient alleles (pVACtools/lossless) = DENOMINATOR
  5_labels: join S1/S2 -> tested peptide -> POSITIVE / TESTED_NEGATIVE; all other universe peptides -> UNTESTED (never coerce)
  6_run: emit unified schema -> four-arm harness (pVAC+PRIME vs lossless+PRIME vs Epicurus); paired hits@20

leakage_adjudication:
  vs_prime_training: LOW (2024, independent; not in the Lausanne 2023 set) — still run the exact+near-peptide k-mer screen.
  vs_iedb_netmhcpan: check whether the 754 assayed peptides are already in IEDB (would contaminate NetMHCpan-EL/BigMHC comparators, not PRIME 2.1).
  split: patient-level holdout; this cohort is LOCKED_TEST — never used for development or tuning.

go_no_go: >-
  No headline unless raw WES/RNA -> re-enumerated candidate universe -> genuine PRIME AND Epicurus ->
  paired hits@20 is reproducible on this cohort with explicit NOT_EVALUABLE where inputs are missing.
